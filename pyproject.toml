[project]
name = "sentinel"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sentinel = "sentinel.channels.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.16", "pre-commit>=4.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "B", "S", "N", "T20", "ERA", "RUF", "I", "UP"]
ignore = [
    "E501",
    # typographic dashes and quotes are expected in Portuguese text
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101"]
# Adapters run fixed system binaries (ping, avahi-resolve, notify-send) with argument lists, never a shell.
# S310: discovery only opens the fixed IEEE https:// URL.
"src/sentinel/probing/*.py" = ["S603", "S607"]
"src/sentinel/discovery/*.py" = ["S603", "S607", "S310"]
"src/sentinel/notify/*.py" = ["S603", "S607"]
"src/sentinel/system/*.py" = ["S603", "S607"]
"src/sentinel/channels/cli.py" = ["T201"]
# The speed test only opens fixed https:// constants, never a URL from input.
"src/sentinel/speed/*.py" = ["S310"]
