[project]
name = "skeleton"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.16", "pre-commit>=4.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skeleton"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "B", "S", "N", "T20", "ERA", "RUF", "I", "UP"]
ignore = [
    "E501",
    # typographic dashes and quotes are expected in Portuguese text
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101"]
