name: ci

# Runs on pull requests only. A draft PR gets the cheap checks on every push; the deep job
# (security, dead code, complexity, mutation) runs once the PR is ready for review, to save
# Actions minutes. Each check goes through scripts/quality_report.py, which keeps the tool's
# exit code (the job is still the gate) and saves a fragment; the report job turns the
# fragments into one table, in the job summary and as a comment on the PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  REPORT: uv run --locked python scripts/quality_report.py run

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: lint
        run: $REPORT ruff-check -- uv run --locked ruff check
      - name: format
        if: ${{ !cancelled() }}
        run: $REPORT ruff-format -- uv run --locked ruff format --check
      - name: types
        if: ${{ !cancelled() }}
        run: $REPORT mypy -- uv run --locked mypy
      - name: architecture
        if: ${{ !cancelled() }}
        run: $REPORT import-linter -- uv run --locked lint-imports
      - name: tests and coverage
        if: ${{ !cancelled() }}
        run: $REPORT pytest -- uv run --locked pytest -q --cov --cov-report=term
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-checks
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  # Mutation only touches the functions this PR changed. MUTATION_MIN_SCORE is a ratchet raised
  # over time (repository variable). The full mutation run is manual, in mutation.yml.
  deep:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUTATION_MIN_SCORE: ${{ vars.MUTATION_MIN_SCORE || '95' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: security
        run: $REPORT bandit -- uv run --locked bandit -q -c pyproject.toml -r src scripts
      - name: dependency vulnerabilities
        if: ${{ !cancelled() }}
        run: $REPORT pip-audit -- uv run --locked pip-audit --skip-editable
      - name: dead code
        if: ${{ !cancelled() }}
        run: $REPORT vulture -- uv run --locked vulture
      - name: complexity
        if: ${{ !cancelled() }}
        run: $REPORT xenon -- uv run --locked xenon src scripts --max-absolute B --max-modules A --max-average A --exclude 'src/sentinel/config.py,src/sentinel/channels/cli.py,src/sentinel/app/speed.py,src/sentinel/app/history.py,src/sentinel/app/report.py'
      # Exact key, no restore-keys: a stale cache could hide the effect of changed tests.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: mutants
          key: mutants-${{ runner.os }}-${{ hashFiles('src/**', 'tests/**', 'pyproject.toml', 'uv.lock') }}
      - name: mutation on changed code
        if: ${{ !cancelled() }}
        run: $REPORT mutation -- uv run --locked python scripts/mutation.py changed --base "origin/${{ github.base_ref || 'main' }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-deep
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  report:
    if: ${{ always() }}
    needs: [checks, deep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          pattern: quality-fragment-*
          merge-multiple: true
          path: quality-fragments
      - name: build report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          uv run --no-project python scripts/quality_report.py render \
            --needs-json "$NEEDS_JSON" --output quality-report.md
          cat quality-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: comment on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('quality-report.md', 'utf8');
            const marker = '<!-- quality-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            if (!issue_number) {
              core.info('Not a pull request run; the report is in the job summary.');
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              return;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
